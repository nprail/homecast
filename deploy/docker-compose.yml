# Homecast on its own, served over plain HTTP on port 8080.
# Good for a LAN or a machine behind your own reverse proxy. For automatic HTTPS with Caddy, use
# docker-compose.caddy.yml instead.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs homecast   # find the bootstrap token
#
# Optional settings go in deploy/.env (see .env.example): HOMECAST_TAG, PUBLIC_URL.
services:
  homecast:
    image: ghcr.io/nprail/homecast:${HOMECAST_TAG:-latest}
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # JWT_SECRET is generated on first run and stored in the data volume; set it here to override (32+ chars).
      # WHISPER_MODEL: small.en-q5_1
    volumes:
      - homecast-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  homecast-data:
