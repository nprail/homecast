# Homecast behind Caddy, which obtains and renews HTTPS certificates automatically.
# Requires a DNS name pointing at this host and ports 80 and 443 open to it.
#
#   1. Copy deploy/.env.example to deploy/.env and set DOMAIN (and optionally HOMECAST_TAG).
#   2. docker compose -f deploy/docker-compose.caddy.yml --env-file deploy/.env up -d
#   3. docker compose -f deploy/docker-compose.caddy.yml --env-file deploy/.env logs homecast
#
# Homecast is not published directly; Caddy is the only entry point.
services:
  homecast:
    image: ghcr.io/nprail/homecast:${HOMECAST_TAG:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      # Trust X-Forwarded-* only from private-network peers (the Caddy container).
      TRUST_PROXY: uniquelocal
      # JWT_SECRET is generated on first run and stored in the data volume; set it here to override (32+ chars).
      # WHISPER_MODEL: small.en-q5_1
    volumes:
      - homecast-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [homecast]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  homecast-data:
  caddy-data:
  caddy-config:
